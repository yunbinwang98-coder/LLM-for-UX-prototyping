<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1eb">
<title>Route 21 · Music for the wait</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{font-family:Roboto,Arial,sans-serif;color:#171717;background:#f4f1eb;--accent:#e83243;--paper:#f4f1eb}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:4px solid var(--accent);outline-offset:5px}button:disabled{cursor:default}
.shell{width:100%;max-width:1080px;min-height:100svh;margin:auto;padding:max(22px,env(safe-area-inset-top)) 24px max(58px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.arrival{text-align:center;width:100%;display:flex;flex-direction:column;gap:12px}.route{font-size:clamp(26px,4vw,42px);font-weight:900;letter-spacing:-.04em;color:var(--accent)}.stop{font-size:clamp(14px,2.6vw,25px);font-weight:500}.eta{font-size:clamp(38px,6vw,68px);font-weight:900;letter-spacing:-.055em;line-height:1.1}.eta small{font-size:.4em;letter-spacing:0;font-weight:500}.feed{font-size:12px;color:#777;min-height:17px}.feed[data-state=live]{color:#25754d}
.controls{height:68px;position:relative;width:min(100%,calc(100svh - 348px));margin-top:14px;display:flex;align-items:center;justify-content:center}.volume{width:100%;display:flex;align-items:center;gap:18px}.mute,.back{border:0;background:transparent;min-width:48px;min-height:48px;border-radius:50%;display:grid;place-items:center}.mute svg{width:27px;height:27px}.volume input{flex:1;min-width:0;height:44px;accent-color:#171717;cursor:pointer}.volume output{width:50px;font-size:16px;font-variant-numeric:tabular-nums}.instruction{font-size:clamp(23px,3.4vw,36px);font-weight:700;text-align:center;margin:0;padding:0 70px;letter-spacing:-.035em}.back{position:absolute;left:0;top:10px;font-size:17px;font-weight:700;border-radius:8px;padding:0 8px}
.status{height:38px;display:flex;align-items:center;justify-content:center;text-align:center;width:100%;font-size:clamp(13px,1.8vw,18px);color:#5e5a55;margin:0}.status[data-state=generating]:before{content:"";width:8px;height:8px;margin-right:9px;background:var(--accent);border-radius:50%;animation:breathe 1.3s ease-in-out infinite}
main{width:100%;display:flex;justify-content:center;margin-top:8px}.disc{position:relative;width:min(100%,calc(100svh - 348px));min-width:260px;aspect-ratio:1;border-radius:50%;isolation:isolate;container-type:inline-size}.record-view,.wheel{position:absolute;inset:0;border-radius:50%;transition:opacity .45s ease,transform .55s ease}.record-view{opacity:1;transform:scale(1)}.disc[data-view=prompt] .record-view{opacity:0;transform:scale(.96);pointer-events:none}.wheel{opacity:0;transform:scale(.96);pointer-events:none}.disc[data-view=prompt] .wheel{opacity:1;transform:scale(1);pointer-events:auto}
.vinyl-platter{position:absolute;inset:0;border-radius:50%;animation:spin 24s linear infinite;background:#111;box-shadow:0 18px 40px #0003}.record{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 3px,#ffffff12 3.5px 4px,transparent 4.5px 7px),radial-gradient(circle,#101010 0 22%,#181818 25%,#090909 55%,#222 80%,#080808 100%);box-shadow:inset 0 0 0 4px #252525,inset 24px 24px 70px #ffffff09}.record:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 12deg,transparent,#ffffff13 35deg,transparent 80deg,transparent 160deg,#ffffff10 190deg,transparent 240deg)}
.timer-surface{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.timer-surface[data-live=false]{opacity:.38;filter:grayscale(1)}.record-action{position:absolute;inset:0;border:0;border-radius:50%;background:transparent;padding:0;display:grid;place-items:center}.label{width:43%;aspect-ratio:1;border-radius:50%;background:#f2f0eb;box-shadow:0 0 0 12px #090909,0 0 0 13px #393939;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7%;gap:18px;text-align:center}.spindle{width:16px;height:16px;flex:none;background:radial-gradient(circle at 30% 25%,#222,#030303);border-radius:50%;box-shadow:0 0 0 2px #ccc}.cta{font-size:clamp(16px,3.1cqw,32px);font-weight:700;line-height:1.2;letter-spacing:-.035em}
.segment{position:absolute;inset:0;border:0;background:#e2e1de;padding:0;transition:background .2s,color .2s}.segment:nth-child(even){background:#eeede9}.segment:hover{background:#d2d0cc}.segment[aria-pressed=true]{background:#cf2936;color:white}.segment:focus-visible{outline:0;background:#bbb8b2}.segment[aria-pressed=true]:focus-visible{background:#b61b2a}.segment:focus-visible .segment-label{outline:3px solid currentColor;outline-offset:7px;border-radius:6px}.segment-label{position:absolute;width:24%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;font-size:clamp(13px,2.6cqw,27px);font-weight:700;line-height:1.15}.segment-label svg{width:clamp(24px,5cqw,48px);height:clamp(24px,5cqw,48px);stroke-width:1.6}.hub{position:absolute;width:42%;height:42%;top:29%;left:29%;border-radius:50%;background:#fffdf9;border:1px solid #ddd9d2;box-shadow:0 4px 20px #0000000b;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:5%;z-index:3}.hub-action{border:0;background:transparent;color:#171717;border-radius:50%;width:100%;height:100%;font-size:clamp(18px,3.2cqw,34px);font-weight:700;line-height:1.15}.hub-action:disabled{color:#999}.hub-action:not(:disabled):after{content:"→";display:block;margin-top:12px;font-size:1.2em;color:var(--accent)}
.hidden{display:none!important}.demo{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));right:24px;border:1px solid #d8d3ca;background:var(--paper);color:#777;border-radius:24px;font-size:12px;min-height:38px;padding:0 15px;z-index:10}.toast{position:fixed;bottom:60px;left:50%;transform:translate(-50%,12px);max-width:90vw;padding:12px 18px;border-radius:20px;background:#171717;color:white;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.35}}
@media(max-width:600px){.shell{padding:18px 16px 58px}.arrival{gap:8px}.controls{margin-top:8px;width:100%}.disc{width:100%;min-width:0}.label{gap:10px}.spindle{width:11px;height:11px}.segment-label{gap:6px}.demo{right:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header class="arrival">
<div class="route">Route 21</div>
<div class="stop">Walnut St &amp; 34th St · Westbound</div>
<div class="eta"><span id="eta">—</span> <small id="etaUnit">Checking arrival</small></div>
<div class="feed" id="feedStatus" data-state="loading" role="status">Connecting to SEPTA</div>
</header>
<div class="controls" id="controls">
<div class="volume" id="volumeControls">
<button class="mute" id="muteButton" type="button" aria-label="Mute music" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9Z"/><path id="speakerWaves" d="M17 8a6 6 0 0 1 0 8M20 5a10 10 0 0 1 0 14"/></svg></button>
<label class="hidden" for="volumeSlider">Music volume</label><input id="volumeSlider" aria-label="Music volume" type="range" min="0" max="100" value="60"><output id="volumeValue" for="volumeSlider">60%</output>
</div>
<div id="promptControls" class="hidden"><button type="button" class="back" id="backButton">← Back</button><h1 class="instruction" id="instruction">Choose your mood</h1></div>
</div>
<p id="generationStatus" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
<main>
<div class="disc" id="recordWrap" data-view="vinyl">
<div class="record-view" id="recordView">
<div class="vinyl-platter"><div class="record"></div><canvas id="timerSurface" class="timer-surface" data-live="false" aria-hidden="true"></canvas></div>
<button class="record-action" id="openPrompt" aria-label="Tap to add your mood to the music" aria-expanded="false" type="button"><span class="label"><span class="spindle" aria-hidden="true"></span><span class="cta">Tap to add your mood to the music</span></span></button>
</div>
<div class="wheel" id="wheel" role="group" aria-labelledby="instruction" inert>
<div id="segments"></div><div class="hub"><button class="hub-action" id="hubAction" disabled type="button">Continue</button></div>
</div>
</div>
</main>
</div>
<button class="demo" id="demoMinute" type="button">1 min demo</button>
<div class="toast" id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const moodOptions=[['calm','Calm','M4 12c4-7 4 7 8 0s4 7 8 0'],['energized','Energized','m13 3-8 11h6l-1 7 9-12h-6Z'],['tired','Tired','M19 15A8 8 0 0 1 9 5a8 8 0 1 0 10 10Z'],['hopeful','Hopeful','M3 18h18M6 14a6 6 0 0 1 12 0M12 3v3M3 7l3 3M21 7l-3 3'],['restless','Restless','M3 8h4l3 8 4-12 3 8h4'],['focused','Focused','M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5M9 12h6M12 9v6'],['inbetween','Somewhere in between','M4 12h16M8 7h8M8 17h8']];
const textureOptions=[['soft','Soft','M4 14c0-4 4-6 8-6s8 2 8 6M6 17h12'],['rhythmic','Rhythmic','M5 8v8M10 4v16M15 8v8M20 6v12'],['airy','Airy','M3 8h12c5 0 5-6 1-6M3 12h17M3 16h10c5 0 5 6 1 6'],['warm','Warm','M12 3c4 5 7 8 7 12a7 7 0 0 1-14 0c0-4 3-7 7-12Z'],['bright','Bright','M12 3v3M12 18v3M3 12h3M18 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z']];
let selectedMood=null,selectedSound=null,promptStep='mood',choices=[],intervalVersion=0,requestRunning=false,generationPending=false,statusTimer,toastTimer;
let generatedAudio=null,generatedAudioUrl=null,audioContext=null,masterGain=null,oscillators=[],volume=.6,lastVolume=.6;
let arrivalAt=null,arrivalKey=null,intervalEnded=false,intervalDuration=1,feedFreshAt=0,displayProgress=0,lastFrame=0,demoUntil=null,demoEndHold=null;
const timerCanvas=$('timerSurface'),timerContext=timerCanvas.getContext('2d');let timerSize=0,timerDpr=1;
    function timerColor(position){
      const stops=[[74,211,151],[225,225,96],[255,173,60],[249,66,53]];
      const p=Math.max(0,Math.min(1,position))*3, i=Math.min(2,Math.floor(p)), t=p-i;
      return `rgb(${stops[i].map((v,k)=>Math.round(v+(stops[i+1][k]-v)*t)).join(',')})`;
    }
    function drawTimer(progress){
      if(!timerSize||!timerContext)return;
      const c=timerContext,s=timerSize,r=s*.335,cx=s/2,cy=s/2,start=Math.PI/2;
      const span=Math.PI*1.9*progress,width=Math.max(2,s*.009);
      c.setTransform(timerDpr,0,0,timerDpr,0,0);c.clearRect(0,0,s,s);
      const segments=Math.ceil(span*r/1.4);
      for(let i=0;i<segments;i++){
        const t=i/segments,next=(i+1)/segments,color=timerColor(progress*t);
        c.beginPath();c.arc(cx,cy,r,start+t*span,start+next*span+.002);
        c.strokeStyle=color;c.lineWidth=width;c.lineCap='butt';c.shadowColor=color;c.shadowBlur=width*1.7;c.stroke();
      }
      c.shadowBlur=0;
      if(progress>0){const end=start+span;c.beginPath();c.arc(cx+r*Math.cos(end),cy+r*Math.sin(end),width/2,0,Math.PI*2);c.fillStyle=timerColor(progress);c.fill()}
      // The side-view bus rides just ahead of the growing line and shares its color.
      const busAngle=start+span+.09;
      const bx=cx+r*Math.cos(busAngle),by=cy+r*Math.sin(busAngle),color=timerColor(progress);
      c.save();c.translate(bx,by);c.rotate(busAngle+Math.PI/2);c.scale(s/450,s/450);
      c.shadowColor=color;c.shadowBlur=5;c.fillStyle=color;
      c.beginPath();c.roundRect(-11,-6,22,11,2.5);c.fill();c.shadowBlur=0;
      c.fillStyle='#14201c';c.beginPath();c.roundRect(-8,-4,13,5,1);c.fill();
      c.fillRect(7,-3,2,5);
      [-6,7].forEach(x=>{c.beginPath();c.arc(x,6,2.4,0,Math.PI*2);c.fillStyle='#101212';c.fill();c.beginPath();c.arc(x,6,.8,0,Math.PI*2);c.fillStyle=color;c.fill()});
      c.restore();
    }

function sizeTimer(){timerSize=$('recordWrap').clientWidth;timerDpr=Math.min(devicePixelRatio||1,3);timerCanvas.width=Math.round(timerSize*timerDpr);timerCanvas.height=Math.round(timerSize*timerDpr);drawTimer(displayProgress)}
new ResizeObserver(sizeTimer).observe($('recordWrap'));
function showToast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3500)}
function setStatus(message,state=''){clearTimeout(statusTimer);$('generationStatus').textContent=message;$('generationStatus').dataset.state=state}
function svgIcon(path){return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="'+path+'"/></svg>'}
function point(angle,r){return [50+Math.cos(angle)*r,50+Math.sin(angle)*r]}
function renderWheel(){
 const options=promptStep==='mood'?moodOptions:textureOptions;
 $('instruction').textContent=promptStep==='mood'?'Choose your mood':'Choose a sound texture';
 $('hubAction').textContent=promptStep==='mood'?'Continue':'Share my choices';
 $('hubAction').disabled=promptStep==='mood'&&!selectedMood;
 $('segments').replaceChildren();
 options.forEach(([key,label,icon],i)=>{
  const step=2*Math.PI/options.length,a=-Math.PI/2+i*step+.014,b=-Math.PI/2+(i+1)*step-.014,polygon=[];
  for(let j=0;j<=30;j++)polygon.push(point(a+(b-a)*j/30,49.5));
  for(let j=30;j>=0;j--)polygon.push(point(a+(b-a)*j/30,22.5));
  const button=document.createElement('button');button.type='button';button.className='segment';button.style.clipPath='polygon('+polygon.map(p=>p.join('% ')+'%').join(',')+')';button.setAttribute('aria-label',label);button.setAttribute('aria-pressed',String((promptStep==='mood'?selectedMood:selectedSound)===key));
  const location=point((a+b)/2,36);button.innerHTML='<span class="segment-label" style="left:'+location[0]+'%;top:'+location[1]+'%">'+svgIcon(icon)+'<span>'+label+'</span></span>';
  button.addEventListener('click',()=>{if(promptStep==='mood')selectedMood=key;else selectedSound=selectedSound===key?null:key;renderWheel();$('segments').children[i].focus()});
  $('segments').append(button);
 });
}
function openPanel(){
 ensureAudio();selectedMood=null;selectedSound=null;promptStep='mood';renderWheel();$('recordWrap').dataset.view='prompt';$('recordView').inert=true;$('wheel').inert=false;$('volumeControls').classList.add('hidden');$('promptControls').classList.remove('hidden');$('openPrompt').setAttribute('aria-expanded','true');$('segments').firstChild.focus();
}
function closePanel(){ $('recordWrap').dataset.view='vinyl';$('wheel').inert=true;$('recordView').inert=false;$('volumeControls').classList.remove('hidden');$('promptControls').classList.add('hidden');$('openPrompt').setAttribute('aria-expanded','false');$('openPrompt').focus()}
$('backButton').addEventListener('click',()=>{if(promptStep==='sound'){promptStep='mood';renderWheel();$('segments').firstChild.focus()}else closePanel()});
$('hubAction').addEventListener('click',()=>{if(promptStep==='mood'){if(!selectedMood)return;promptStep='sound';renderWheel();$('segments').firstChild.focus()}else commit()});
$('openPrompt').addEventListener('click',openPanel);
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('recordWrap').dataset.view==='prompt')closePanel()});
function syncVolume(){
 $('volumeSlider').value=Math.round(volume*100);$('volumeValue').textContent=Math.round(volume*100)+'%';$('muteButton').setAttribute('aria-pressed',String(volume===0));$('muteButton').setAttribute('aria-label',volume===0?'Unmute music':'Mute music');$('speakerWaves').setAttribute('d',volume===0?'m17 9 5 6m0-6-5 6':'M17 8a6 6 0 0 1 0 8M20 5a10 10 0 0 1 0 14');if(generatedAudio)generatedAudio.volume=volume;if(masterGain&&audioContext)masterGain.gain.setTargetAtTime(volume*.14,audioContext.currentTime,.05);
}
function stopDemoAudio(){oscillators.forEach(osc=>osc.stop());oscillators=[];if(audioContext)audioContext.close();audioContext=null;masterGain=null}
function ensureAudio(){
 if(generatedAudio){generatedAudio.play().catch(()=>showToast('Tap the volume control to play the music'));return}
 if(audioContext){audioContext.resume();return}
 try{audioContext=new (window.AudioContext||window.webkitAudioContext)();masterGain=audioContext.createGain();masterGain.gain.value=volume*.14;masterGain.connect(audioContext.destination);[174,220,261].forEach((frequency,i)=>{const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.value=.18/(i+1);oscillator.connect(gain);gain.connect(masterGain);oscillator.start();oscillators.push(oscillator)})}catch{showToast('Audio is unavailable in this browser')}
}
$('volumeSlider').addEventListener('input',()=>{volume=Number($('volumeSlider').value)/100;if(volume>0)lastVolume=volume;syncVolume();ensureAudio()});
$('muteButton').addEventListener('click',()=>{if(volume>0){lastVolume=volume;volume=0}else volume=lastVolume||.6;syncVolume();ensureAudio()});
function tallyChoices(){const tally={moods:{},textures:{}};choices.forEach(choice=>{tally.moods[choice.mood]=(tally.moods[choice.mood]||0)+1;if(choice.sound)tally.textures[choice.sound]=(tally.textures[choice.sound]||0)+1});return tally}
function commit(){if(!selectedMood)return;choices.push({mood:selectedMood,sound:selectedSound});closePanel();generationPending=true;runGeneration()}
function loadAudio(audio){return new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{cleanup();reject(new Error('Audio loading timed out'))},15000);const cleanup=()=>{clearTimeout(timeout);audio.removeEventListener('canplay',ready);audio.removeEventListener('error',failed)};const ready=()=>{cleanup();resolve()};const failed=()=>{cleanup();reject(new Error('Unable to load music'))};audio.addEventListener('canplay',ready,{once:true});audio.addEventListener('error',failed,{once:true});audio.load()})}
async function runGeneration(){
 if(requestRunning||!generationPending||!choices.length)return;
 requestRunning=true;generationPending=false;const version=intervalVersion;const tally=tallyChoices();setStatus('Making music from riders’ moods…','generating');
 let nextUrl=null;
 try{
  const response=await fetch('/api/soundscape',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tally}),signal:AbortSignal.timeout(100000)});
  if(!response.ok){let detail={};try{detail=await response.json()}catch{}throw new Error(detail.error||'Music generation failed')}
  const blob=await response.blob();if(version!==intervalVersion)return;
  nextUrl=URL.createObjectURL(blob);const next=new Audio(nextUrl);next.loop=true;next.volume=volume;next.preload='auto';await loadAudio(next);if(version!==intervalVersion)return;
  // Start the replacement before stopping the current audio.
  try{await next.play()}catch{setStatus('New music is ready. Tap the volume control to listen.');}
  if(generatedAudio)generatedAudio.pause();stopDemoAudio();if(generatedAudioUrl)URL.revokeObjectURL(generatedAudioUrl);generatedAudio=next;generatedAudioUrl=nextUrl;nextUrl=null;
  if(!next.paused){setStatus('New music is ready.');statusTimer=setTimeout(()=>setStatus(''),4500)}
 }catch(error){if(version===intervalVersion){console.warn('Music update unavailable:',error.message);setStatus('Music could not update. The current sound will keep playing.');statusTimer=setTimeout(()=>setStatus(''),7000)}}
 finally{if(nextUrl)URL.revokeObjectURL(nextUrl);requestRunning=false;if(generationPending&&choices.length)runGeneration()}
}
function beginNextInterval(){intervalVersion++;choices=[];generationPending=false;intervalEnded=true;setStatus('')}
function setFeedStatus(state,label){$('feedStatus').dataset.state=state;$('feedStatus').textContent=label}
async function refreshArrival(){
 try{
  const response=await fetch('/api/arrival',{cache:'no-store'});const data=await response.json();if(!response.ok||data.route!=='21'||data.stopId!=='21360')throw new Error('Invalid feed');
  if(data.status!=='live'||!data.arrivalAt){arrivalAt=null;setFeedStatus('error',data.status==='no-arrival'?'No live ETA available':'SEPTA feed delayed');return}
  const next=Date.parse(data.arrivalAt);if(!Number.isFinite(next))throw new Error('Invalid arrival');
  const nextKey=data.arrivalKey||String(next);
  if(nextKey!==arrivalKey){
   if(arrivalKey!==null&&!intervalEnded&&!demoUntil)beginNextInterval();
   arrivalKey=nextKey;intervalEnded=false;intervalDuration=Math.max(1,(next-Date.now())/1000);if(!demoUntil)displayProgress=0;
  }else{intervalDuration=Math.max(intervalDuration,(next-Date.now())/1000,1)}
  arrivalAt=next;feedFreshAt=Date.now();setFeedStatus('live','Live SEPTA');
 }catch{arrivalAt=null;setFeedStatus('error','Arrival information unavailable')}
}
function tick(timestamp){
 const elapsed=lastFrame?Math.min(.2,(timestamp-lastFrame)/1000):.016;lastFrame=timestamp;
 const live=arrivalAt!==null&&Date.now()-feedFreshAt<45000;const active=demoUntil!==null||live;const end=demoUntil??arrivalAt;
 if(active){
  const remaining=Math.max(0,(end-Date.now())/1000),duration=demoUntil?60:intervalDuration,target=Math.max(0,Math.min(1,1-remaining/duration));
  displayProgress+=(target-displayProgress)*Math.min(1,elapsed*3);$('eta').textContent=remaining===0?'Arriving now':Math.ceil(remaining/60);$('etaUnit').textContent=remaining===0?'':'min away';timerCanvas.dataset.live='true';
  if(remaining===0&&!intervalEnded){beginNextInterval();if(demoUntil)demoEndHold=Date.now()+2500}
  if(demoUntil&&demoEndHold&&Date.now()>=demoEndHold){demoUntil=null;demoEndHold=null;intervalEnded=false;intervalDuration=Math.max(1,((arrivalAt||Date.now())-Date.now())/1000);displayProgress=0;$('demoMinute').textContent='1 min demo';refreshArrival()}
 }else{displayProgress=0;timerCanvas.dataset.live='false';$('eta').textContent='—';$('etaUnit').textContent='No live ETA'}
 drawTimer(displayProgress);requestAnimationFrame(tick);
}
$('demoMinute').addEventListener('click',()=>{if(demoUntil)return;beginNextInterval();intervalEnded=false;demoUntil=Date.now()+60000;demoEndHold=null;displayProgress=0;$('demoMinute').textContent='Demo running';showToast('Demo countdown · live arrivals return in one minute')});
sizeTimer();syncVolume();requestAnimationFrame(tick);refreshArrival();setInterval(refreshArrival,20000);
</script>
</body>
</html>
